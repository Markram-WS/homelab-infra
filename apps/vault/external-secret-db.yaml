apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-secret
  namespace: database
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgresql-secret
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: secret/database/postgresql
        property: postgres-password
    - secretKey: pguser
      remoteRef:
        key: secret/database/postgresql
        property: pguser
    - secretKey: pguser-password
      remoteRef:
        key: secret/database/postgresql
        property: pguser-password
