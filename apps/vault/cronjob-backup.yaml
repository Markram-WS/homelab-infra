apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
  namespace: vault
spec:
  schedule: "0 3 * * *"
  timeZone: "Asia/Bangkok"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: vault-backup
          containers:
            - name: backup
              image: postgres:16-alpine
              env:
                - name: TZ
                  value: Asia/Bangkok
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk add --no-cache kubectl minio-client
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  SNAP_FILE="vault-vault-$TIMESTAMP.snap"

                  echo "Taking Vault snapshot at $(date)"

                  # Unseal vault if sealed
                  STATUS=$(kubectl exec vault-0 -n vault -- vault status -format=json 2>/dev/null | grep -c '"sealed": true' || true)
                  if [ "$STATUS" -eq 1 ]; then
                    echo "Vault is sealed, unsealing..."
                    UNSEAL_KEY=$(kubectl get secret vault-keys -n vault -o jsonpath='{.data.unseal_key}' | base64 -d)
                    kubectl exec vault-0 -n vault -- vault operator unseal "$UNSEAL_KEY"
                  fi

                  # Snapshot via stdout pipe directly to MinIO
                  echo "Uploading snapshot to MinIO..."
                  MINIO_ACCESS_KEY=$(kubectl get secret minio-secret -n minio -o jsonpath='{.data.root-user}' | base64 -d)
                  MINIO_SECRET_KEY=$(kubectl get secret minio-secret -n minio -o jsonpath='{.data.root-password}' | base64 -d)
                  mcli alias set homelab http://minio.minio.svc.cluster.local:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
                  mcli mb "homelab/backup" --ignore-existing
                  kubectl exec vault-0 -n vault -- vault operator raft snapshot save - | mcli pipe "homelab/backup/vault/$SNAP_FILE"
                  echo "Snapshot uploaded: $SNAP_FILE"

                  # Cleanup old snapshots
                  mcli rm --force "homelab/backup/vault/" --recursive --older-than 30d || true

                  echo "Vault backup finished at $(date)"
