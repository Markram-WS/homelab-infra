apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-dump-backup
  namespace: database
spec:
  schedule: "0 2 * * *"
  timeZone: "Asia/Bangkok"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache minio-client
                  exec /scripts/backup.sh
              env:
                - name: TZ
                  value: Asia/Bangkok
                - name: PGHOST
                  value: postgresql.database.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: homelab
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-secret
                      key: pguser-password
                - name: PGDATABASE
                  value: homelab
                - name: MINIO_ENDPOINT
                  value: http://minio.minio.svc.cluster.local:9000
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-user
                      optional: true
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-password
                      optional: true
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: pg-dump-script
                defaultMode: 0755
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
