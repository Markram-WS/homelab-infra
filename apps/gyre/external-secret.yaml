---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gyre-admin
  namespace: flux-ui
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gyre-initial-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/gyre/admin
        property: password
