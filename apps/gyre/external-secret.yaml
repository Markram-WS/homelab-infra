apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gyre-encryption
  namespace: flux-ui
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gyre-encryption
    creationPolicy: Owner
  data:
    - secretKey: GYRE_ENCRYPTION_KEY
      remoteRef:
        key: secret/gyre/encryption
        property: GYRE_ENCRYPTION_KEY
    - secretKey: AUTH_ENCRYPTION_KEY
      remoteRef:
        key: secret/gyre/encryption
        property: AUTH_ENCRYPTION_KEY
    - secretKey: BACKUP_ENCRYPTION_KEY
      remoteRef:
        key: secret/gyre/encryption
        property: BACKUP_ENCRYPTION_KEY
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: secret/gyre/encryption
        property: BETTER_AUTH_SECRET

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gyre-metrics
  namespace: flux-ui
