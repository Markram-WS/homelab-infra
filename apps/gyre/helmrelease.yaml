apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gyre
  namespace: flux-ui
spec:
  interval: 15m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: gyre
    namespace: flux-system
  values:
    replicaCount: 1
    origin: http://gyre-tailscale.flux-ui.svc:9001
    service:
      port: 9001
    persistence:
      enabled: true
      storageClass: local-path
      size: 1Gi
    encryption:
      existingSecret: gyre-encryption
    metrics:
      existingSecret: gyre-metrics
    networkPolicy:
      enabled: false
    admin:
      autoGenerate: false
    readinessProbe:
      httpGet:
        path: /api/v1/health
        port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3
    rbac:
      clusterRole:
        readOnly: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: gyre
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: gyre
              spec:
                template:
                  spec:
                    containers:
                      - name: gyre
                        env:
                          - name: NODE_ENV
                            value: development
